[project]
name = "esb-api"
version = "0.1.0"
description = "Enugu Smart Bus accounts and auth API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.7.1",
    "pydantic[email]>=2.10.4",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "pyjwt>=2.10.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2.3",
]

[dependency-groups]
dev = ["pytest>=8.3.4", "ruff>=0.9.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
